<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskLink Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'task-primary': '#4f46e5', // Indigo
                        'task-secondary': '#10b981', // Emerald
                        'task-background': '#f9fafb',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        /* Custom styling to center the login card on the screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e5e7eb; /* Light gray background */
            font-family: 'Inter', sans-serif;
        }
        /* Mobile-like container (removed fixed height to allow login content to fit) */
        #app-container {
            width: 100%;
            max-width: 400px; /* Max mobile size */
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 24px;
            background-color: #fff;
        }
    </style>
</head>
<body class="font-sans">

    <div id="app-container">

        <div id="login" class="flex flex-col items-center p-4">

            <div class="mb-8 text-center">
                <svg class="w-12 h-12 mx-auto text-task-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13l2 2 4-4"/>
                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/>
                    <path d="M8 12h8"/> 
                </svg>

                <h1 class="mt-3 text-3xl font-extrabold text-gray-900">
                    TaskLink
                </h1>
                <p class="text-sm text-gray-500">Log in to your account</p>
            </div>

            <form action="index.html" method="GET" class="w-full space-y-5">
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required 
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-task-primary focus:border-task-primary transition" 
                           placeholder="you@example.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required 
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-task-primary focus:border-task-primary transition" 
                           placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-task-primary border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                            Remember me
                        </label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-task-primary hover:text-task-primary/80">
                            Forgot your password?
                        </a>
                    </div>
                </div>

                <div>
                    <button type="submit" 
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-lg font-semibold text-white bg-task-primary hover:bg-task-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-task-primary transition duration-150">
                        Sign In
                    </button>
                </div>
            </form>
            
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">
                            Or continue with
                        </span>
                    </div>
                </div>
            </div>

            <div class="mt-6 w-full space-y-3">
                <button type="button" class="w-full flex items-center justify-center py-3 px-4 border border-gray-300 rounded-xl shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition">
                    <svg class="w-5 h-5 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.343c-1.806,2.783-4.99,5-8.343,5c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12 c3.437,0,6.564,1.45,8.835,3.783L39.208,7.915C35.244,4.195,30.077,2,24,2C11.85,2,2,11.85,2,24s9.85,22,22,22 s22-9.85,22-22c0-1.341-0.138-2.658-0.413-3.957"/></svg>
                    Sign in with Google
                </button>
            </div>

            <div class="mt-6 text-center text-sm">
                <p class="text-gray-600">
                    Don't have an account?
                    <a href="#" class="font-medium text-task-secondary hover:text-task-secondary/80">
                        Sign Up
                    </a>
                </p>
            </div>

        </div>

    </div>

</body>
</html>
